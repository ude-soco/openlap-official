apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
      - name: web
        image: indicatorframework
        envFrom:
        - configMapRef:
            name: web
        ports:
        - containerPort: 8080
          protocol: TCP
        # The renamed Deployment is ready only when nginx can serve the SPA.
        startupProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
