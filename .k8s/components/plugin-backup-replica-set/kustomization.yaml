apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
- name: openlap-plugin-backup-replica-set
  behavior: merge
  files:
  - replica-set.sh
  - replica-set.js
patches:
- path: mongo.yaml
- target:
    kind: Deployment
    name: openlap-official-openlap-analyticsframework-mongo
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --replSet
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: $(OPENLAP_MONGODB_REPLICA_SET)
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --oplogSize
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: $(OPENLAP_MONGODB_OPLOG_SIZE_MIB)
