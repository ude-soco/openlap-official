apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
- name: openlap-plugin-backup-replica-set
  behavior: merge
  files:
  - replica-set.sh
  - replica-set.js
patches:
- path: mongo.yaml
  target:
    kind: Deployment
    labelSelector: app.kubernetes.io/name=openlap-official,service=mongo,app.kubernetes.io/component in (analyticsframework,openlap-analyticsframework)
- path: service.yaml
  target:
    kind: Service
    labelSelector: app.kubernetes.io/name=openlap-official,service=mongo,app.kubernetes.io/component in (analyticsframework,openlap-analyticsframework)
- target:
    kind: Deployment
    labelSelector: app.kubernetes.io/name=openlap-official,service=mongo,app.kubernetes.io/component in (analyticsframework,openlap-analyticsframework)
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --replSet
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: $(OPENLAP_MONGODB_REPLICA_SET)
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --oplogSize
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: $(OPENLAP_MONGODB_OPLOG_SIZE_MIB)
