apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Select only with Garage during the staged backend-name cutover. The default
# policy admits the new backend label; this bridge additionally admits existing
# backend Pods until their replacements are verified. Other policy rules remain
# unchanged, and the old label is removed again by dropping this component.
patches:
- target:
    kind: NetworkPolicy
    name: openlap-plugin-storage
  patch: |-
    - op: remove
      path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1component
    - op: add
      path: /spec/ingress/0/from/0/podSelector/matchExpressions
      value:
      - key: app.kubernetes.io/component
        operator: In
        values:
        - analyticsframework
        - openlap-analyticsframework
