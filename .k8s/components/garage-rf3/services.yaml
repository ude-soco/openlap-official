apiVersion: v1
kind: Service
metadata:
  name: garage-rf3-rpc
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: garage-rf3
  ports:
  - name: rpc
    port: 3901
    targetPort: rpc
---
apiVersion: v1
kind: Service
metadata:
  name: garage-rf3-s3
spec:
  selector:
    app.kubernetes.io/component: garage-rf3
  ports:
  - name: s3
    port: 3900
    targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: garage-rf3-admin
spec:
  selector:
    app.kubernetes.io/component: garage-rf3
  ports:
  - name: admin
    port: 3903
    targetPort: admin
