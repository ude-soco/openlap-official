apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage-rf3
spec:
  replicas: 3
  serviceName: garage-rf3-rpc
  podManagementPolicy: Parallel
  # Initial pods intentionally remain unready until the operator pins identities.
  # Explicit replacement avoids feature/version-dependent rolling-update waits.
  updateStrategy:
    type: OnDelete
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/component: garage-rf3
  template:
    metadata:
      labels:
        app.kubernetes.io/component: garage-rf3
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: garage-rf3
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Only fresh, dedicated claims may be selected for this installation.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: garage
        image: ghcr.io/ude-soco/openlap-official-garage-rf3:configure-reviewed-digest
        imagePullPolicy: Always
        args: [--configure-storage]
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: s3
          containerPort: 3900
        - name: rpc
          containerPort: 3901
        - name: admin
          containerPort: 3903
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        startupProbe:
          tcpSocket:
            port: rpc
          periodSeconds: 2
          failureThreshold: 60
        livenessProbe:
          tcpSocket:
            port: rpc
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [python3, -B, /opt/openlap/garage-rf3.py, ready, --config, /config/settings.json, --secrets, /secrets]
          timeoutSeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: storage
          mountPath: /data
        - name: settings
          mountPath: /config
          readOnly: true
        - name: node-secrets
          mountPath: /secrets
          readOnly: true
        - name: private
          mountPath: /tmp
      volumes:
      - name: settings
        configMap:
          name: garage-rf3-settings
      - name: node-secrets
        projected:
          defaultMode: 0444
          sources:
          - secret:
              name: configure-garage-rf3-node-secrets
              items:
              - key: rpc-secret
                path: rpc-secret
              - key: admin-token
                path: admin-token
      - name: private
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      storageClassName: configure-existing-storage-class
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 2Gi
