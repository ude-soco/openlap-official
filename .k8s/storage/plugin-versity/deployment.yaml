apiVersion: apps/v1
kind: Deployment
metadata:
  name: openlap-plugin-versity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: plugin-versity
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plugin-versity
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: storage
        image: ghcr.io/ude-soco/openlap-official-plugin-storage-versity:configure-reviewed-digest
        args: [--serve]
        env:
        - name: PLUGIN_STORAGE_S3_BUCKET
          value: ""
        - name: PLUGIN_STORAGE_S3_REGION
          value: ""
        ports:
        - name: s3
          containerPort: 9000
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 1Gi
        readinessProbe:
          exec:
            command: [/bin/sh, -ceu, "test -f /tmp/openlap-storage-ready"]
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: s3
          initialDelaySeconds: 60
          periodSeconds: 20
        volumeMounts:
        - name: data
          mountPath: /storage
          readOnly: true
        - name: data
          mountPath: /objects
          subPath: objects
        - name: data
          mountPath: /lease
          subPath: lease
        - name: root-credentials
          mountPath: /run/openlap-root
          readOnly: true
        - name: client-credentials
          mountPath: /run/openlap-client
          readOnly: true
        - name: work
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openlap-plugin-versity
      - name: root-credentials
        secret:
          secretName: openlap-plugin-storage-root
          defaultMode: 292
          items:
          - key: ROOT_ACCESS_KEY_ID
            path: ROOT_ACCESS_KEY_ID
          - key: ROOT_SECRET_ACCESS_KEY
            path: ROOT_SECRET_ACCESS_KEY
      - name: client-credentials
        secret:
          secretName: openlap-plugin-storage-client
          defaultMode: 292
          items:
          - key: PLUGIN_STORAGE_S3_ACCESS_KEY
            path: PLUGIN_STORAGE_S3_ACCESS_KEY
          - key: PLUGIN_STORAGE_S3_SECRET_KEY
            path: PLUGIN_STORAGE_S3_SECRET_KEY
      - name: work
        emptyDir:
          sizeLimit: 64Mi
