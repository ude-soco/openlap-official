apiVersion: batch/v1
kind: Job
metadata:
  name: openlap-plugin-backup-upload
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plugin-backup-upload
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: uploader
        image: ghcr.io/ude-soco/openlap-official-plugin-backup-upload:configure-reviewed-digest
        imagePullPolicy: Always
        args: [--configure-upload]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
            ephemeral-storage: 256Mi
        volumeMounts:
        - name: checkpoint
          mountPath: /checkpoint
          readOnly: true
        - name: sources
          mountPath: /sources
          readOnly: true
        - name: outputs
          mountPath: /outputs
        - name: config
          mountPath: /run/plugin-backup-config
          readOnly: true
        - name: work
          mountPath: /tmp
      volumes:
      - name: checkpoint
        persistentVolumeClaim:
          claimName: configure-protected-checkpoint-volume
      - name: sources
        persistentVolumeClaim:
          claimName: configure-protected-plugin-sources-volume
      # Must be genuinely distinct from every input claim and backing data volume.
      - name: outputs
        persistentVolumeClaim:
          claimName: configure-distinct-retained-encrypted-output-volume
      - name: config
        secret:
          secretName: configure-scoped-backup-client
          defaultMode: 292
          items:
          - key: RCLONE_CONFIG_BASE64
            path: rclone.conf.b64
      - name: work
        emptyDir:
          sizeLimit: 128Mi
