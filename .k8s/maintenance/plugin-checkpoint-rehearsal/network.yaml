apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openlap-plugin-checkpoint-rehearsal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: plugin-checkpoint-rehearsal
  policyTypes: [Ingress, Egress]
  # No source database, DNS, object store or Kubernetes API access. Restore is loopback only.
  ingress: []
  egress: []
