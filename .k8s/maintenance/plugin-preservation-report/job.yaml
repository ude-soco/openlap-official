apiVersion: batch/v1
kind: Job
metadata:
  name: openlap-plugin-preservation-report
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plugin-preservation-report
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: report
        image: python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
        command: [python3, -B, /report/report.py, --backup-root, /backup]
        env:
        - name: CHECKPOINT_ID
          value: ""
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: code
          mountPath: /report
          readOnly: true
        - name: backup
          mountPath: /backup
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: openlap-plugin-preservation-report-code
      # Select the already-owned retained claim explicitly in an operator overlay.
      # No PVC or filesystem ownership repair is installed by this component.
      - name: backup
        persistentVolumeClaim:
          claimName: configure-reviewed-preservation-volume
          readOnly: true
