apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openlap-plugin-recovery-migration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: plugin-recovery-migration
  policyTypes: [Ingress, Egress]
  ingress: []
  # The operator selects only DNS and primary MongoDB access. Add S3 egress only for an explicitly reviewed apply operation.
  egress: []
