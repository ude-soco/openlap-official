apiVersion: batch/v1
kind: Job
metadata:
  name: openlap-plugin-preservation-capture
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: plugin-preservation
    spec:
      serviceAccountName: openlap-plugin-preservation
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: client
        image: python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
        command: [python3, -B, /capture/client.py]
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        volumeMounts:
        - name: code
          mountPath: /capture
          readOnly: true
        - name: tools
          mountPath: /tools
      containers:
      - name: preserve
        image: python@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
        command: [python3, -B, /capture/capture.py, --in-cluster]
        env:
        - name: PATH
          value: /tools:/usr/local/bin:/usr/bin:/bin
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Empty required inputs fail before any Kubernetes read or backup write.
        - name: BACKEND_PODS
          value: ""
        - name: DATABASE_POD
          value: ""
        - name: DATABASE_NAME
          value: ""
        - name: EXPECTED_BACKEND_DIGEST
          value: ""
        - name: CHECKPOINT_ID
          value: ""
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: code
          mountPath: /capture
          readOnly: true
        - name: tools
          mountPath: /tools
          readOnly: true
        - name: backup
          mountPath: /backup
        - name: work
          mountPath: /tmp
        - name: identity
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: openlap-plugin-preservation-code
      - name: tools
        emptyDir:
          sizeLimit: 128Mi
      - name: backup
        persistentVolumeClaim:
          claimName: openlap-plugin-preservation
      - name: work
        emptyDir:
          sizeLimit: 128Mi
      - name: identity
        projected:
          defaultMode: 0440
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 600
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
