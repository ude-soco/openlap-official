apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openlap-plugin-recovery-preflight
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: plugin-recovery-preflight
  policyTypes: [Ingress, Egress]
  ingress: []
  # The operator selects only DNS and primary MongoDB access. No S3 access.
  egress: []
