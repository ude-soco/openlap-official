<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenLAP</title>
  <style>body{margin:0;background:white;font:14px system-ui,sans-serif}main{width:100%;min-width:0}h1,h2{font-size:18px;text-align:center;padding:12px;margin:0}iframe{max-width:100%}[role=status]{padding:0 16px}button{margin:8px;padding:8px 16px}</style>
  <script defer th:src="@{/v1/code/runtime.js}"></script>
</head>
<body><main>
  <h1 th:text="${questionName}">OpenLAP question</h1>
  <section th:each="chart : ${questionCharts}" data-openlap-chart th:attr="data-type-id=${chart.typeId},data-title=${chart.name}">
    <h2 th:text="${chart.name}"></h2>
    <template data-chart-code th:utext="${chart.code}"></template>
    <div data-chart-slot></div>
  </section>
</main></body></html>
