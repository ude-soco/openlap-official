version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"

- package-ecosystem: "docker"
  directory: "/analyticsframework"
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "docker"
  - "analyticsframework"

- package-ecosystem: "maven"
  directory: "/analyticsframework"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "java"
  - "analyticsframework"

- package-ecosystem: "docker"
  directory: "/indicatorframework"
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "docker"
  - "indicatorframework"

- package-ecosystem: "npm"
  directory: "/indicatorframework"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "javascript"
  - "indicatorframework"
