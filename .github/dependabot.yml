version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"

- package-ecosystem: "docker"
  directory: "/analyticsframework"
  schedule:
    interval: "weekly"
  # Preserve the qualified Java 25 LTS runtime; patches and digests still update.
  ignore:
  - dependency-name: "amazoncorretto"
    update-types: ["version-update:semver-major"]
  labels:
  - "dependencies"
  - "docker"
  - "analyticsframework"

- package-ecosystem: "maven"
  directory: "/analyticsframework"
  schedule:
    interval: "daily"
  # Legacy plugin Pair support must remain usable on the Java 17 baseline.
  ignore:
  - dependency-name: "org.openjfx:javafx-base"
    update-types: ["version-update:semver-major"]
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "java"
  - "analyticsframework"

- package-ecosystem: "docker"
  directory: "/indicatorframework"
  schedule:
    interval: "weekly"
  labels:
  - "dependencies"
  - "docker"
  - "indicatorframework"

- package-ecosystem: "npm"
  directory: "/indicatorframework"
  schedule:
    interval: "daily"
  open-pull-requests-limit: 10
  labels:
  - "dependencies"
  - "javascript"
  - "indicatorframework"
