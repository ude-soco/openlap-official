name: Continuous Integration

on:
  push:
    tags:       [ v*.*.* ]
    branches:   [ main ]
  pull_request:
    branches:   [ main ]

jobs:
  maven-wrapper:
    name: Verify Maven wrapper bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check verified downloads and extraction fallbacks
        run: python3 -B tests/test_maven_wrapper.py

  images:
    name: Build container images
    uses: ./.github/workflows/build.yml
    with:
      project_desc:    ${{ github.event.repository.name }}
      base_image_name: ghcr.io/${{ github.repository }}-
      services:        '[ "analyticsframework", "indicatorframework" ]'
      push:            ${{ github.event_name != 'pull_request' }}
      verify_plugin_runtime: true
      publish_legacy_edge_aliases: true
      registry_host:   ghcr.io
      registry_user:   ${{ github.actor }}
    secrets:
      registry_token:  ${{ secrets.GITHUB_TOKEN }}
