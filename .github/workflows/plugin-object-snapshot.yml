name: Logical plugin snapshot recovery fixtures

on:
  pull_request:
    paths:
    - 'openlap-analyticsframework/src/main/java/**'
    - 'openlap-analyticsframework/pom.xml'
    - 'openlap-analyticsframework/Dockerfile.plugin-storage-versity'
    - 'tests/fixtures/PluginObjectSnapshotQualification.java'
    - 'tests/verify_plugin_object_snapshot_containers.py'
    - 'tests/verify_plugin_versity_containers.py'
    - '.github/workflows/plugin-object-snapshot.yml'
  push:
    branches: [main]
    paths:
    - 'openlap-analyticsframework/src/main/java/**'
    - 'openlap-analyticsframework/pom.xml'
    - 'openlap-analyticsframework/Dockerfile.plugin-storage-versity'
    - 'tests/fixtures/PluginObjectSnapshotQualification.java'
    - 'tests/verify_plugin_object_snapshot_containers.py'
    - 'tests/verify_plugin_versity_containers.py'
    - '.github/workflows/plugin-object-snapshot.yml'

permissions:
  contents: read

jobs:
  logical-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Prepare public build inputs
      run: |
        set -eu
        mkdir -p "$RUNNER_TEMP/snapshot-context/src/main"
        cp openlap-analyticsframework/pom.xml openlap-analyticsframework/Dockerfile.plugin-storage-versity "$RUNNER_TEMP/snapshot-context/"
        cp -R openlap-analyticsframework/src/main/java "$RUNNER_TEMP/snapshot-context/src/main/"
    - uses: docker/setup-buildx-action@v4
    - name: Build snapshot runtime without publishing
      uses: docker/build-push-action@v7
      with:
        context: ${{ runner.temp }}/snapshot-context
        file: ${{ runner.temp }}/snapshot-context/Dockerfile.plugin-storage-versity
        platforms: linux/amd64
        push: false
        load: true
        tags: openlap-plugin-snapshot-fixture:tested
        provenance: false
        cache-from: type=gha,scope=plugin-object-snapshot
        cache-to: type=gha,mode=max,scope=plugin-object-snapshot
    - name: Qualify packaged snapshot class on isolated generated data
      run: |
        set -eu
        image_id="$(docker image inspect openlap-plugin-snapshot-fixture:tested --format '{{.Id}}')"
        python3 -B tests/verify_plugin_object_snapshot_containers.py --image "$image_id"
