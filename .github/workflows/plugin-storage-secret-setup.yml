name: Plugin storage secret setup

on:
  pull_request:
    paths:
    - 'openlap-analyticsframework/scripts/plugin-storage-secret-setup.py'
    - 'tests/test_plugin_storage_secret_setup.py'
    - '.github/workflows/plugin-storage-secret-setup.yml'
  push:
    branches: [main]
    paths:
    - 'openlap-analyticsframework/scripts/plugin-storage-secret-setup.py'
    - 'tests/test_plugin_storage_secret_setup.py'
    - '.github/workflows/plugin-storage-secret-setup.yml'

permissions:
  contents: read

jobs:
  native-setup:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Verify private setup using synthetic local inputs
      run: python3 -B -m unittest discover -s tests -p test_plugin_storage_secret_setup.py -v
