name: Verify historical plugin preparation

on:
  pull_request:
    branches: [main]
    paths:
      - analyticsframework/scripts/prepare-plugin-recovery.py
      - docs/plugin-recovery-artifacts.json
      - tests/test_prepare_plugin_recovery.py
      - .github/workflows/plugin-recovery.yml
  push:
    branches: [main]
    paths:
      - analyticsframework/scripts/prepare-plugin-recovery.py
      - docs/plugin-recovery-artifacts.json
      - tests/test_prepare_plugin_recovery.py
      - .github/workflows/plugin-recovery.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Obtain only the pinned public historical commit
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: '0'
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
          GIT_TERMINAL_PROMPT: '0'
          GIT_ASKPASS: /bin/false
          SSH_ASKPASS: /bin/false
        run: >-
          git -c credential.helper= -c credential.interactive=false
          -c protocol.allow=never -c protocol.https.allow=always
          fetch --no-tags --depth=1 --no-recurse-submodules
          https://github.com/ude-soco/openlap-official.git
          4768ec732c667940e00dfc5a87e0300ed0a7ef75

      - name: Verify pinned objects and preparation safeguards
        run: python3 -B -m unittest discover -s tests -p test_prepare_plugin_recovery.py -v
