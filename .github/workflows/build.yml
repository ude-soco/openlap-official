name: Build container images

on:
  workflow_call:
    inputs:
      base_image_name:
        type: string
        required: true
      services:
        type: string
        required: true
      platforms:
        type: string
        default: "linux/amd64"
        required: false
      push:
        type: boolean
        default: false
        required: false
      verify_plugin_runtime:
        type: boolean
        default: false
        required: false
      publish_legacy_edge_aliases:
        type: boolean
        default: false
        required: false
      timeout:
        type: number
        default: 20
        required: false
      project_desc:
        type: string
        required: true
      registry_host:
        type: string
        required: true
      registry_user:
        type: string
        required: true
    secrets:
      registry_token:
        required: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    # Serialize each image/ref through canonical and temporary alias publication.
    concurrency:
      group: image-${{ github.repository }}-${{ matrix.service }}-${{ github.ref }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(inputs.services) }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms:  ${{ inputs.platforms }}

    - name: Check verified runtime platform
      if: inputs.verify_plugin_runtime
      env:
        BUILD_PLATFORMS: ${{ inputs.platforms }}
      run: test "$BUILD_PLATFORMS" = linux/amd64

    - name: Verify image compatibility publication guards without registry access
      if: inputs.publish_legacy_edge_aliases
      run: python3 -B tests/test_framework_image_aliases.py

    - name: Login to container registry
      if:   ${{ inputs.push }}
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry_host }}
        username: ${{ inputs.registry_user }}
        password: ${{ secrets.registry_token }}

    - name: Determine latest semver tag
      id:   latest
      run: |
        echo "version=$(git tag | sort -V | tail -n 1)" >> "$GITHUB_OUTPUT"

    - name: Determine container image name
      id:   image_name
      run: |
        echo "full=${{ inputs.base_image_name }}$(echo ${{ matrix.service }} | sed s#/#-#g)" >> "$GITHUB_OUTPUT"
        cat $GITHUB_OUTPUT

    - name: Get tagging metadata
      id:   meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image_name.outputs.full }}
        flavor:
          latest=false
        tags: |
          type=edge
          type=raw,value=latest,enable=${{ github.ref_type == 'tag' && github.ref_name == steps.latest.outputs.version }}
          type=semver,pattern={{version}}
          type=ref,event=branch,enable=${{ github.ref_name != 'main' }}
          type=ref,event=pr

    - name: Determine Git commit timestamp
      run: echo "TIMESTAMP=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

    - name: Obtain reviewed public chart history
      if: inputs.verify_plugin_runtime && matrix.service == 'analyticsframework'
      env:
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_GLOBAL: /dev/null
        GIT_CONFIG_COUNT: '0'
        GIT_NO_LAZY_FETCH: '1'
        GIT_NO_REPLACE_OBJECTS: '1'
        GIT_TERMINAL_PROMPT: '0'
        GIT_ASKPASS: /bin/false
        SSH_ASKPASS: /bin/false
      run: >-
        git -c credential.helper= -c credential.interactive=false
        -c protocol.allow=never -c protocol.https.allow=always
        fetch --no-tags --depth=1 --no-recurse-submodules
        https://github.com/ude-soco/openlap-official.git
        4768ec732c667940e00dfc5a87e0300ed0a7ef75
        acd1751d1ad256ec4b6e91d8e4321a23f33745fa

    - name: Build and push container image
      id: build
      uses: docker/build-push-action@v7
      env:
        SOURCE_DATE_EPOCH: ${{ env.TIMESTAMP }}
      with:
        platforms:  ${{ inputs.platforms }}
        provenance: false
        context:    ${{ matrix.service }}
        tags:       ${{ steps.meta.outputs.tags }}
        labels:     ${{ steps.meta.outputs.labels }}
        push:       ${{ inputs.push && !inputs.verify_plugin_runtime }}
        load:       ${{ inputs.verify_plugin_runtime }}
        cache-from: type=gha
        cache-to:   type=gha,mode=max
        build-args: |
          VITE_EMAIL_TEMPLATE_ID=${{ vars.VITE_EMAIL_TEMPLATE_ID }}
          VITE_EMAIL_SERVICE_ID=${{ vars.VITE_EMAIL_SERVICE_ID }}
          VITE_EMAIL_PUBLIC_KEY=${{ vars.VITE_EMAIL_PUBLIC_KEY }}

    - name: Verify historical charts against the packaged backend
      if: inputs.verify_plugin_runtime && matrix.service == 'analyticsframework'
      env:
        TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: >-
        python3 -B analyticsframework/scripts/verify-legacy-c3.py
        --image "$TESTED_IMAGE_ID" --runtime-layout spring-boot

    - name: Verify historical Apex charts against the packaged backend
      if: inputs.verify_plugin_runtime && matrix.service == 'analyticsframework'
      env:
        TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: >-
        python3 -B analyticsframework/scripts/verify-legacy-apex.py
        --image "$TESTED_IMAGE_ID" --runtime-layout spring-boot

    - name: Verify packaged backend startup and HTTP contracts
      if: inputs.verify_plugin_runtime && matrix.service == 'analyticsframework'
      env:
        TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
      run: >-
        python3 -B analyticsframework/scripts/verify-packaged-backend.py
        --image "$TESTED_IMAGE_ID"

    - name: Publish the verified image without rebuilding
      if: inputs.push && inputs.verify_plugin_runtime
      env:
        TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        TESTED_IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        EXPECTED_IMAGE_NAME: ${{ steps.image_name.outputs.full }}
      run: |
        set -eu
        test "$(docker image inspect "$TESTED_IMAGE_ID" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
        test -n "$TESTED_IMAGE_TAGS"
        while IFS= read -r release_tag; do
          test -n "$release_tag" || continue
          case "$release_tag" in
            "$EXPECTED_IMAGE_NAME":*) ;;
            *) exit 1 ;;
          esac
          test "$(docker image inspect "$release_tag" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
          docker image push "$release_tag"
        done <<EOF
        $TESTED_IMAGE_TAGS
        EOF

    # Temporary bridge for existing edge consumers. Remove after their image
    # references migrate; historical semver tags and latest are never aliased.
    - name: Publish temporary legacy edge aliases
      if: inputs.push && inputs.verify_plugin_runtime && inputs.publish_legacy_edge_aliases && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ude-soco/openlap-official'
      env:
        SERVICE: ${{ matrix.service }}
        TESTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        CANONICAL_IMAGE_NAME: ${{ steps.image_name.outputs.full }}
      run: |
        set -eu
        case "$SERVICE" in
          analyticsframework) legacy_service=openlap-analyticsframework ;;
          indicatorframework) legacy_service=openlap-indicatoreditor ;;
          *) exit 1 ;;
        esac
        test "$CANONICAL_IMAGE_NAME" = "ghcr.io/ude-soco/openlap-official-$SERVICE"
        canonical_edge="$CANONICAL_IMAGE_NAME:edge"
        legacy_edge="ghcr.io/ude-soco/openlap-official-$legacy_service:edge"
        case "$TESTED_IMAGE_ID" in sha256:*) ;; *) exit 1 ;; esac
        test "${#TESTED_IMAGE_ID}" -eq 71
        case "${TESTED_IMAGE_ID#sha256:}" in *[!0-9a-f]*) exit 1 ;; esac
        test "$(docker image inspect "$TESTED_IMAGE_ID" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
        test "$(docker image inspect "$canonical_edge" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
        docker image tag "$TESTED_IMAGE_ID" "$legacy_edge"
        test "$(docker image inspect "$legacy_edge" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"
        docker image push "$legacy_edge"
        canonical_digest="$(docker buildx imagetools inspect "$canonical_edge" --format '{{.Manifest.Digest}}')"
        legacy_digest="$(docker buildx imagetools inspect "$legacy_edge" --format '{{.Manifest.Digest}}')"
        case "$canonical_digest" in sha256:*) ;; *) exit 1 ;; esac
        test "${#canonical_digest}" -eq 71
        case "${canonical_digest#sha256:}" in *[!0-9a-f]*) exit 1 ;; esac
        test "$canonical_digest" = "$legacy_digest"

    - name: Output tags
      if: inputs.push
      run: 'echo "::notice::Tags pushed: ${{ steps.meta.outputs.tags }}"'

    - name: Update registry description
      if:   ${{ github.ref_type == 'tag' && github.ref_name == steps.latest.outputs.version }}
      uses: christian-korneck/update-container-description-action@v1
      env:
        DOCKER_USER: ${{ secrets.registry_user }}
        DOCKER_PASS: ${{ secrets.registry_token }}
      with:
        destination_container_repo: ${{ steps.image_name.outputs.full }}
        provider: dockerhub
        short_description: $${{ inputs.project_desc }}, ${{ matrix.service }} service
        readme_file: 'README.md'
      continue-on-error: true
