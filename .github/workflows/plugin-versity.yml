name: Build optional plugin gateway image

on:
  push:
    branches: [main]
    tags: [plugin-versity-*]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-plugin-storage-versity

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-id: ${{ steps.identity.outputs.image-id }}
      tags: ${{ steps.meta.outputs.tags }}
      archive-id: ${{ steps.archive.outputs.artifact-id }}
      archive-sha: ${{ steps.saved.outputs.archive-sha }}
    steps:
      - name: Checkout public sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare only public build inputs
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/versity-context/src/main"
          cp openlap-analyticsframework/pom.xml openlap-analyticsframework/Dockerfile.plugin-storage-versity "$RUNNER_TEMP/versity-context/"
          cp -R openlap-analyticsframework/src/main/java "$RUNNER_TEMP/versity-context/src/main/"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Get image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref_name, 'plugin-versity-') }}
            type=ref,event=pr

      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/versity-context
          file: ${{ runner.temp }}/versity-context/Dockerfile.plugin-storage-versity
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=plugin-versity
          cache-to: type=gha,mode=max,scope=plugin-versity

      - name: Resolve the exact loaded image
        id: identity
        env:
          BUILT_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          tag = os.environ['BUILT_TAGS'].splitlines()[0]
          if not tag.startswith(os.environ['IMAGE_NAME'] + ':'):
              raise SystemExit('Unexpected image name.')
          image = subprocess.check_output(['docker', 'image', 'inspect', tag, '--format', '{{.Id}}'], text=True).strip()
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', image):
              raise SystemExit('Invalid loaded image identity.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('image-id=' + image + '\n')
          PY

      - name: Qualify exact image on disposable Linux storage
        env:
          IMAGE_ID: ${{ steps.identity.outputs.image-id }}
        run: python3 -B tests/verify_plugin_versity_containers.py --image "$IMAGE_ID"

      - name: Qualify packaged snapshots from the same exact image
        env:
          IMAGE_ID: ${{ steps.identity.outputs.image-id }}
        run: python3 -B tests/verify_plugin_object_snapshot_containers.py --image "$IMAGE_ID"

      - name: Prove encrypted recovery with the same exact gateway image
        env:
          IMAGE_ID: ${{ steps.identity.outputs.image-id }}
        run: python3 -B tests/verify_plugin_combined_recovery.py --snapshot-image "$IMAGE_ID" --verify-operator-runner --report "$RUNNER_TEMP/plugin-combined-recovery.json"

      - name: Retain the bounded synthetic recovery proof
        uses: actions/upload-artifact@v7
        with:
          name: plugin-combined-recovery-proof
          path: ${{ runner.temp }}/plugin-combined-recovery.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain exact tested image for publication
        if: github.event_name == 'push'
        id: saved
        env:
          TESTED_IMAGE_ID: ${{ steps.identity.outputs.image-id }}
        run: |
          set -eu
          umask 077
          mkdir "$RUNNER_TEMP/plugin-versity-image"
          docker image save --output "$RUNNER_TEMP/plugin-versity-image/image.tar" "$TESTED_IMAGE_ID"
          printf '%s\n' "$TESTED_IMAGE_ID" > "$RUNNER_TEMP/plugin-versity-image/image-id.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/plugin-versity-image/source-revision.txt"
          cd "$RUNNER_TEMP/plugin-versity-image"
          sha256sum image.tar > image.sha256
          printf 'archive-sha=%s\n' "$(sha256sum image.tar | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload verified image archive
        if: github.event_name == 'push'
        id: archive
        uses: actions/upload-artifact@v7
        with:
          name: tested-plugin-versity-image
          path: ${{ runner.temp }}/plugin-versity-image/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this run's exact tested image
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.image.outputs.archive-id }}
          path: ${{ runner.temp }}/plugin-versity-image

      - name: Verify and load without rebuilding
        env:
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
          TESTED_ARCHIVE_SHA: ${{ needs.image.outputs.archive-sha }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/plugin-versity-image"
          printf '%s  image.tar\n' "$TESTED_ARCHIVE_SHA" | sha256sum --check --status
          sha256sum --check image.sha256
          test "$(cat image-id.txt)" = "$TESTED_IMAGE_ID"
          test "$(cat source-revision.txt)" = "$GITHUB_SHA"
          docker image load --input image.tar
          test "$(docker image inspect "$TESTED_IMAGE_ID" --format '{{.Id}}')" = "$TESTED_IMAGE_ID"

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        env:
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
          TESTED_IMAGE_TAGS: ${{ needs.image.outputs.tags }}
        run: |
          set -eu
          test -n "$TESTED_IMAGE_TAGS"
          while IFS= read -r release_tag; do
            test -n "$release_tag" || continue
            case "$release_tag" in
              "$IMAGE_NAME":*) ;;
              *) exit 1 ;;
            esac
            docker image tag "$TESTED_IMAGE_ID" "$release_tag"
            docker image push "$release_tag"
          done <<EOF
          $TESTED_IMAGE_TAGS
          EOF

      - name: Record immutable published identity
        env:
          TESTED_IMAGE_ID: ${{ needs.image.outputs.image-id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          image = os.environ['TESTED_IMAGE_ID']
          refs = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image, '--format', '{{json .RepoDigests}}'], text=True))
          prefix = os.environ['IMAGE_NAME'] + '@'
          refs = sorted(ref for ref in refs if ref.startswith(prefix) and re.fullmatch(r'sha256:[a-f0-9]{64}', ref[len(prefix):]))
          if not refs:
              raise SystemExit('No verified immutable published identity.')
          Path('publication.json').write_text(json.dumps({'sourceRevision': os.environ['GITHUB_SHA'], 'testedImageId': image, 'references': refs}, indent=2) + '\n')
          PY

      - name: Retain publication record
        uses: actions/upload-artifact@v7
        with:
          name: plugin-versity-publication
          path: publication.json
          if-no-files-found: error
          retention-days: 7
